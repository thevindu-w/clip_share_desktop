<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content=same-origin">
    <title>ClipShare</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            background-color: #F0F0F0;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 8px;
        }

        .header {
            display: flex;
            align-items: center;
            height: 48px;
            margin-top: 8px;
            margin-bottom: 4px;
        }

        .header label {
            flex: 0.22;
            font-size: 16pt;
            text-align: right;
            margin-right: 5px;
        }

        .header input {
            flex: 0.4;
            height: 100%;
            padding-left: 4px;
            margin-right: 15px;
            font-size: 14pt;
            border-radius: 10px;
            border-style: ridge;
        }

        .header button {
            flex: 0.2;
            height: 100%;
            background-color: #5555FF;
            color: white;
            font-size: 14pt;
            font-weight: bold;
            cursor: pointer;
        }

        .header label {
            margin-right: 10px;
            font-weight: bolder;
            color: #666;
        }

        .output {
            flex: 1;
            margin: 12px 10px 0;
            padding: 10px;
            font-size: 10pt;
            white-space: pre-wrap;
            overflow-y: auto;
            line-height: 1.5;
            border: 1px solid #ddd;
            background-color: #FFF;
            border-radius: 10px;
        }

        button {
            border-radius: 10px;
            text-align: center;
        }

        .btn-row {
            display: flex;
            justify-content: space-between;
            height: 64px;
            margin: 6px 10px 0;
        }

        .btn-row button {
            height: 100%;
            font-size: 15pt;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .btn-send {
            flex: 0.32;
            background-color: red;
        }

        .btn-get {
            flex: 0.32;
            background-color: green;
        }

        .btn-row .split-btn {
            background-color: green;
            border: none;
            border-radius: 10px;
            font-size: 0;
            display: flex;
        }

        .btn-row .split-btn button {
            background-color: green;
        }

        .btn-row .split-btn button:nth-child(1) {
            flex: 1;
            border-right: none;
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
            margin-right: 0;
        }

        .btn-row .split-btn button:nth-child(2) {
            border-left: 1px solid lightgray;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            margin-left: 0;
            padding-left: 1rem;
            padding-right: 1rem;
            font-size: 16pt;
        }

        #manual-type {
            display: none;
        }

        #auto-type .btn-send {
            flex: 1;
        }

        .bottom-row {
            margin-top: 6px;
            margin-bottom: 18px;
        }

        #overlay {
            position: fixed;
            z-index: 1;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background-color: #4449;
            padding-bottom: 10vh;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #popup {
            background-color: white;
            padding: 2%;
            border-radius: 10px;
        }

        #popup div.display {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #popup div.display label {
            margin-right: 10px;
            font-size: 14pt;
            font-weight: bold;
            color: black;
        }

        #popup div.display input {
            font-size: 13pt;
            padding: 3px;
        }

        #popup div.buttons {
            margin: 0;
            padding: 0;
            margin-top: 5%;
            white-space: nowrap;
            font-size: 2em;
        }

        #popup div.buttons button {
            width: 10em;
            color: white;
            font-size: 14pt;
            font-weight: bold;
            cursor: pointer;
            padding: 3%;
            white-space: nowrap;
        }

        #popup div.buttons button.copied-img {
            background-color: #5A0;
        }

        #popup div.buttons button.screenshot {
            background-color: #087;
        }

        #popup div.list-item {
            margin: 5px 0;
            width: 100%;
            min-width: 20em;
        }

        #popup div.list-item label {
            padding: 10px;
            width: 100%;
            display: inline-block;
            background-color: lightgray;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <label for="server">SERVER</label>
            <input type="text" id="server" placeholder="192.168.1.2">
            <button onclick="onScan()">SCAN</button>
        </div>

        <div id="output" class="output">
        </div>

        <div id="auto-type" class="btn-row">
            <button class="btn-send" onclick="onSendAuto()">SEND</button>
        </div>
        <div id="manual-type" class="btn-row">
            <button class="btn-send" onclick="onSendTxt()">SEND TEXT</button>
            <button class="btn-send" onclick="onSendImg()">SEND IMAGE</button>
            <button class="btn-send" onclick="onSendFile()">SEND FILE</button>
        </div>

        <div class="btn-row bottom-row">
            <button class="btn-get" onclick="onGetTxt()">GET TEXT</button>
            <div class="split-btn btn-get">
                <button onclick="onGetImg()">GET IMAGE</button>
                <button onclick="onGetImgOptions()">&#9650;</button>
            </div>
            <button class="btn-get" onclick="onGetFile()">GET FILE</button>
        </div>
    </div>
    <div id="overlay">
        <div id="popup">
            <div id="display-select" hidden>
                <div class="display">
                    <label for="server">Display</label>
                    <input type="number" id="display" placeholder="1" min="0" max="65535">
                </div>
                <div class="buttons">
                    <button class="copied-img" onclick="onGetCopiedImg()">Copied Image</button>
                    <button class="screenshot" onclick="onGetScreenshot()">Screenshot</button>
                </div>
            </div>
            <div id="addr-list">
                <div class="list-item" hidden>
                    <label onclick="onSelectServer(this)"></label>
                </div>
            </div>
        </div>
    </div>

    <script>
        const serverInput = document.getElementById('server');
        const outputTxt = document.getElementById('output');
        const overlay = document.getElementById('overlay');
        const popup = document.getElementById('popup');
        const displayInput = document.getElementById('display');
        const displaySelect = document.getElementById('display-select');
        const addrList = document.getElementById('addr-list');
        const autoTypeRow = document.getElementById('auto-type');
        const manualTypeRow = document.getElementById('manual-type');

        function getStateChangeFn(xhr, successMsgPrefix, failureMsg) {
            return function () {
                try {
                    if (xhr.readyState == XMLHttpRequest.DONE) {
                        switch (xhr.status) {
                            case 200: {
                                let data = xhr.responseText;
                                if (!data) data = '';
                                outputTxt.innerText = successMsgPrefix + data.substring(0, 32768);
                                return;
                            }
                            case 404: {
                                outputTxt.innerText = failureMsg.no_data;
                                return;
                            }
                            case 400:
                            case 403:
                            case 500:
                            case 501:
                            case 502:
                            case 504: {
                                outputTxt.innerText = 'Error occurred!';
                                return;
                            } case 503: {
                                outputTxt.innerText = 'Server unreachable!';
                                return;
                            }
                        }
                    }
                } catch (error) {
                }
                outputTxt.innerText = failureMsg.general;
            };
        };

        function sendRequest(path, additionalParams) {
            additionalParams = additionalParams || {};
            const server = serverInput.value;
            if (!/^((25[0-5]|(2[0-4]|1\d|[1-9]|)\d)(\.(?!$)|$)){4}$/.test(server)) {
                alert('Invalid server address');
                return null;
            }
            const xhr = new XMLHttpRequest();
            const queryList = ['server=' + encodeURI(server)];
            for (let key in additionalParams) {
                if (additionalParams.hasOwnProperty(key)) {
                    const value = additionalParams[key];
                    queryList.push(encodeURI(key) + '=' + encodeURI(value));
                }
            }
            xhr.open("POST", path + '?' + queryList.join('&'), true);
            xhr.send();
            return xhr;
        }

        function onGetTxt() {
            const xhr = sendRequest('/get/text');
            if (xhr) xhr.onreadystatechange = getStateChangeFn(xhr, 'Received:\n', { no_data: 'No text copied!', general: 'Get text failed!' });
        }

        function onGetImg() {
            const xhr = sendRequest('/get/image');
            if (xhr) xhr.onreadystatechange = getStateChangeFn(xhr, 'Saved image to ', { no_data: 'No image copied!', general: 'Get image failed!' });
        }

        function onGetCopiedImg() {
            const xhr = sendRequest('/get/copied-image');
            if (xhr) xhr.onreadystatechange = getStateChangeFn(xhr, 'Saved image to ', { no_data: 'No image copied!', general: 'Get image failed!' });
            overlay.click();
        }

        function getDisplay() {
            const displayStr = displayInput.value;
            if (isNaN(displayStr)) return -1;
            const display = parseFloat(displayStr);
            if (isNaN(display)) return -1;
            if (!Number.isInteger(display)) return -1;
            if (display < 0 || display >= 65536) return -1;
            return display;
        }

        function onGetScreenshot() {
            const display = getDisplay();
            if (display === -1) {
                alert('Invalid display value');
                return;
            }
            const xhr = sendRequest('/get/screenshot', { display: display });
            if (xhr) xhr.onreadystatechange = getStateChangeFn(xhr, 'Saved image to ', { no_data: 'Invalid display!', general: 'Get image failed!' });
            overlay.click();
        }

        function showPopup(child) {
            for (let node of popup.children) {
                node.style.display = 'none';
            }
            child.style.display = 'block';
            overlay.style.display = 'flex';
        }

        function onGetImgOptions() {
            showPopup(displaySelect);
        }

        function onGetFile() {
            const xhr = sendRequest('/get/file');
            if (xhr) xhr.onreadystatechange = getStateChangeFn(xhr, 'Received all files', { no_data: 'No files copied!', general: 'Get files failed!' });
        }

        function onSendTxt() {
            const xhr = sendRequest('/send/text');
            if (xhr) xhr.onreadystatechange = getStateChangeFn(xhr, 'Sent:\n', { no_data: 'No text copied!', general: 'Send text failed!' });
        }

        function onSendFile() {
            const xhr = sendRequest('/send/file');
            if (xhr) xhr.onreadystatechange = getStateChangeFn(xhr, 'Sent all files', { no_data: 'No files copied!', general: 'Send text failed!' });
        }

        function onSendImg() {
            const xhr = sendRequest('/send/image');
            if (xhr) xhr.onreadystatechange = getStateChangeFn(xhr, 'Sent image: ', { no_data: 'No image copied!', general: 'Send image failed!' });
        }

        function onSendAuto() {
            const xhr = sendRequest('/send/auto');
            if (xhr) xhr.onreadystatechange = getStateChangeFn(xhr, 'Sent: ', { no_data: 'Nothing is copied!', general: 'Send failed!' });
        }

        function onSelectServer(elem) {
            serverInput.value = elem.innerText;
            overlay.click();
        }

        function onScan() {
            const xhr = new XMLHttpRequest();
            xhr.open("POST", "/scan", true);
            xhr.send();
            xhr.onreadystatechange = function () {
                try {
                    if (xhr.readyState == XMLHttpRequest.DONE) {
                        if (xhr.status != 200) {
                            alert("Scan failed");
                            return;
                        }
                        let data = xhr.responseText;
                        if (!data) data = '';
                        if (!data) alert('No servers found');
                        let servers = data.split(',');
                        if (servers.length > 1) {
                            while (addrList.childElementCount > 1) {
                                addrList.removeChild(addrList.lastElementChild);
                            }
                            for (let server of servers) {
                                let elem = addrList.firstElementChild.cloneNode(true);
                                elem.firstElementChild.innerText = server;
                                elem.style.display = 'block';
                                addrList.appendChild(elem);
                            }
                            showPopup(addrList);
                        } else {
                            serverInput.value = servers[0];
                        }
                    }
                } catch (error) {
                    alert("Scan failed");
                }
            }
        }

        overlay.onclick = function (e) {
            overlay.style.display = 'none';
            e.stopPropagation();
        }

        popup.onclick = function (e) {
            e.stopPropagation();
        }

        function setSendType(isAuto) {
            if (isAuto) {
                autoTypeRow.style.display = 'flex';
                manualTypeRow.style.display = 'none';
            } else {
                autoTypeRow.style.display = 'none';
                manualTypeRow.style.display = 'flex';
            }
        }

        function applySettings() {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', '/settings', false);
            xhr.send();
            if (xhr.status != 200) return;
            const settings = JSON.parse(xhr.response);
            setSendType(settings.autoDetectSendType);
        }

        applySettings();
    </script>
</body>

</html>
